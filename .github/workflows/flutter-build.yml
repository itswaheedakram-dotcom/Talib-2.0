name: Flutter Build

on:
  push:
    branches:
      - main
      - 78c6-yaha-se-new-branch-banai-he-ab-firestore-py-kam-kren-gy
  workflow_dispatch:

jobs:
  flutter_setup:
    name: Flutter Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Generate Android project
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .

      - name: Configure Android project
        shell: bash
        run: |
          set -e
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i -E 's/applicationId = "[^"]+"/applicationId = "com.talib.app"/' android/app/build.gradle.kts
          sed -i -E 's/namespace = "[^"]+"/namespace = "com.talib.app"/' android/app/build.gradle.kts
          sed -i '/org.jetbrains.kotlin.android/s/version "[^"]*"/version "2.3.0"/' android/settings.gradle.kts
          grep 'org.jetbrains.kotlin.android' android/settings.gradle.kts

      - name: Prepare Kotlin compiler configuration
        shell: bash
        run: |
          set -e
          test -f android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{.*?^\s*\}',
              '''kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }''',
              s,
              count=1,
          )
          s = s.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
          p.write_text(s)
          PY
          grep -q 'JvmTarget.JVM_17' android/app/build.gradle.kts
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' android/app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' android/app/build.gradle.kts
          sed -n '1,100p' android/app/build.gradle.kts

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talib-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Trigger verification build after Firebase isolation.
# Build verification after restoring compile-time compatibility.
# Trigger after fixing hostel Firestore imports.
