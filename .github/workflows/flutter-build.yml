name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter_setup:
    name: Flutter setup diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Verify Flutter
        run: flutter --version
