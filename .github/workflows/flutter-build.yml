name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  flutter_setup:
    name: Flutter Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Generate Android project
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .

      - name: Configure Android project
        shell: bash
        run: |
          set -e
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i -E 's/applicationId = "[^"]+"/applicationId = "com.talib.app"/' android/app/build.gradle.kts
          sed -i -E 's/namespace = "[^"]+"/namespace = "com.talib.app"/' android/app/build.gradle.kts

          # Firebase Auth 24.2.0 is compiled with Kotlin metadata 2.3.0.
          python3 -c 'from pathlib import Path; import re; p=Path("android/settings.gradle.kts"); s=p.read_text(); s=re.sub(r\'id\(\"org\\.jetbrains\\.kotlin\\.android\"\) version \"[^\"]+\"\', \'id("org.jetbrains.kotlin.android") version "2.3.0"\', s); p.write_text(s)'

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talib-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
