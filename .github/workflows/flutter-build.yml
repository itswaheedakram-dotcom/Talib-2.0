name: Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Generate Android project
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .

      - name: Configure minimal Android launcher
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i -E 's/applicationId = "[^"]+"/applicationId = "com.talib.app"/' android/app/build.gradle.kts
            sed -i -E 's/namespace = "[^"]+"/namespace = "com.talib.app"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            sed -i -E 's/applicationId "[^"]+"/applicationId "com.talib.app"/' android/app/build.gradle
            sed -i -E 's/namespace "[^"]+"/namespace "com.talib.app"/' android/app/build.gradle || true
          else
            echo "Android app Gradle file not found"
            exit 1
          fi

          # Do NOT apply Google Services or copy google-services.json in this
          # diagnostic build. Firebase native auto-initialization is intentionally
          # isolated so a native Firebase configuration crash cannot terminate launch.
          rm -f android/app/google-services.json

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talib-launch-diagnostic-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
