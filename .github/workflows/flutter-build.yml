name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnostic:
    name: GitHub Actions diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "GitHub Actions runner is working"
          echo "OS: $(uname -a)"
          echo "Repo: $GITHUB_REPOSITORY"
          echo "SHA: $GITHUB_SHA"
