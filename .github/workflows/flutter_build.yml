name: Flutter Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
      - run: flutter pub get
      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze
      - name: Generate Android project
        run: flutter create --platforms=android --project-name talib_2 --org com.talib .
      - name: Configure Firebase Android
        run: cp google-services.json android/app/google-services.json
      - name: Configure Firebase Gradle plugin
        shell: bash
        run: |
          if [ -f android/settings.gradle.kts ]; then
            python3 - <<'PY'
from pathlib import Path
p=Path("android/settings.gradle.kts")
s=p.read_text()
if 'com.google.gms.google-services' not in s:
    s=s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.4" apply false', 1)
p.write_text(s)
PY
          fi
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
from pathlib import Path
p=Path("android/app/build.gradle.kts")
s=p.read_text()
if 'com.google.gms.google-services' not in s:
    s=s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
p.write_text(s)
PY
          fi
      - name: Configure Android compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
          sed -i -E 's/(org\.jetbrains\.kotlin\.android.*version ")[^"]+/\12.3.0/' android/settings.gradle.kts
          # Kotlin 2.3 requires the compilerOptions DSL. Keep Java and Kotlin on JVM 17.
          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
import re
from pathlib import Path

p = Path("android/app/build.gradle.kts")
s = p.read_text()

# Flutter's generated template may still contain the deprecated Kotlin DSL.
s = re.sub(
    r'(?ms)^\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*JavaVersion\.VERSION_11\.toString\(\)\s*\}',
    '''kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}''',
    s,
)

s = s.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
p.write_text(s)
PY
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/JavaVersion\\.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle
          fi

          # Force the final Android application ID and namespace to com.talib.app.
          # flutter create derives these from --org/--project-name, so set them explicitly.
          python3 - <<'PY'
import re
from pathlib import Path

p = Path("android/app/build.gradle.kts")
if p.exists():
    s = p.read_text()
    s = re.sub(r'(?m)^(\s*namespace\s*=\s*)".*?"', r'\1"com.talib.app"', s, count=1)
    s = re.sub(r'(?m)^(\s*applicationId\s*=\s*)".*?"', r'\1"com.talib.app"', s, count=1)
    p.write_text(s)
else:
    p = Path("android/app/build.gradle")
    if not p.exists():
        raise SystemExit("Android app Gradle file not found")
    s = p.read_text()
    s = re.sub(r'(?m)^(\s*namespace\s+)"[^"]+"', r'\1"com.talib.app"', s, count=1)
    s = re.sub(r'(?m)^(\s*applicationId\s+)"[^"]+"', r'\1"com.talib.app"', s, count=1)
    p.write_text(s)
PY
      - name: Build debug APK
        run: flutter build apk --debug
