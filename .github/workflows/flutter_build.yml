name: Flutter Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
