name: Flutter Build Check

on:
  push:
    branches: [main, firestore-from-78c6-stable]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
      - run: flutter pub get
      - name: Verify institute and demo workflows
        run: flutter test test/drawer_test.dart test/auth_entry_test.dart test/user_profile_test.dart test/institute_reviews_test.dart test/student_affiliation_test.dart test/institute_program_intake_test.dart test/institute_workflow_test.dart test/institute_detail_listings_test.dart test/demo_identity_integration_test.dart test/smart_search_parser_test.dart
      - name: Verify institute notification function
        run: node --test functions/institute_notifications.test.js
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Generate Android project
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .
      - name: Configure Android compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/JavaVersion\.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/JavaVersion\.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\) version ")[^"]+(")/\12.3.0\2/' android/settings.gradle.kts
          fi
          if [ -f android/app/build.gradle.kts ]; then
            perl -0pi -e 's/^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}//ms' android/app/build.gradle.kts
            sed -i -E '/^[[:space:]]*jvmTarget[[:space:]]*=.*toString\(\)/d' android/app/build.gradle.kts
            printf '\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            perl -0pi -e 's/^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}//ms' android/app/build.gradle
            sed -i -E '/^[[:space:]]*jvmTarget[[:space:]]*=.*toString\(\)/d' android/app/build.gradle
            printf '\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n' >> android/app/build.gradle
          fi

      - name: Verify Kotlin compiler configuration
        shell: bash
        run: |
          file="android/app/build.gradle.kts"
          [ -f "$file" ] || file="android/app/build.gradle"
          cat "$file"
          if grep -Eq 'jvmTarget[[:space:]]*=.*(VERSION_|toString\(\))|kotlinOptions' "$file"; then
            echo "ERROR: Legacy Kotlin JVM target configuration remains."
            exit 1
          fi

      - name: Build debug APK
        run: flutter build apk --debug

  review-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public review permissions in local emulator
        env:
          CI: 'true'
        run: npx --yes firebase-tools@14.19.0 emulators:exec --project demo-talib-review-tests --only firestore "python3 test/institute_reviews_rules_check.py && python3 test/student_affiliation_rules_check.py"
