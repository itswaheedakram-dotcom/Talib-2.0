name: Flutter Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
      - run: flutter pub get
      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze
      - name: Generate Android project
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .
      - name: Configure Android compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
          sed -i -E 's/(org\.jetbrains\.kotlin\.android.*version ")[^"]+/\12.3.0/' android/settings.gradle.kts
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/^[[:space:]]*kotlinOptions[[:space:]]*{[[:space:]]*$/,/^[[:space:]]*}[[:space:]]*$/d' android/app/build.gradle.kts
          fi
      - name: Build debug APK
        run: flutter build apk --debug
