name: Build Android APK
on:
  push:
    branches: [main, firestore-from-78c6-stable]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .
      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart
      - name: Configure Android SDK compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
      - name: Configure Kotlin and Java compatibility
        shell: bash
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\) version ")[^"]+(")/\12.3.0\2/' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+(")/\12.3.0\2/' android/settings.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E '/^[[:space:]]*kotlinOptions[[:space:]]*\{/,/^[[:space:]]*\}/c\    kotlin {\n        compilerOptions {\n            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n        }\n    }' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talib-2-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
