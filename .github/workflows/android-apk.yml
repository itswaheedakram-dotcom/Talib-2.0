name: Build Android APK
on:
  push:
    branches: [main, firestore-from-78c6-stable]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name talib_2 --org com.talib2 .
      - name: Remove generated Flutter sample test
        run: rm -f test/widget_test.dart
      - name: Configure Android SDK compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: talib-2-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
